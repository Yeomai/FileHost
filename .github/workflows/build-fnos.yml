name: Build FnOS X86 Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fnos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Install npm 11
        run: |
          npm install -g npm@11.12.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build FnOS x86 package
        run: npm run pack:fpk

      - name: List package
        run: ls -lh dist-fpk/*.fpk

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "PicHost v$VERSION" \
              --notes "PicHost release for version $VERSION"

          gh release upload "$TAG" dist-fpk/*.fpk --clobber

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: PicHost-FnOS-X86-${{ env.TAG }}
          path: dist-fpk/*.fpk
          if-no-files-found: error
          retention-days: 14
