name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV

      - name: Install npm 11
        shell: pwsh
        run: |
          npm install -g npm@11.12.1
          npm --version

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress

          $chocoRoot = if ($env:ChocolateyInstall) {
            $env:ChocolateyInstall
          } else {
            'C:\ProgramData\chocolatey'
          }
          $ffmpeg = Get-ChildItem (Join-Path $chocoRoot 'lib\ffmpeg') -Recurse -Filter ffmpeg.exe -File |
            Where-Object { Test-Path (Join-Path $_.DirectoryName 'ffprobe.exe') } |
            Select-Object -First 1

          if (-not $ffmpeg) {
            throw '未找到有效版本的 ffmpeg.exe 和 ffprobe.exe'
          }

          "FFMPEG_DIR=$($ffmpeg.DirectoryName)" >> $env:GITHUB_ENV
          & (Join-Path $ffmpeg.DirectoryName 'ffmpeg.exe') -version

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:build

      - name: List installer
        shell: pwsh
        run: Get-ChildItem dist-windows\release -Filter *.exe | Format-Table Name, Length

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG `
              --target $env:GITHUB_SHA `
              --title "PicHost v$env:VERSION" `
              --notes "Windows installer for PicHost $env:VERSION"
            if ($LASTEXITCODE -ne 0) {
              throw '创建 GitHub Release 失败'
            }
          }

          $exe = Get-ChildItem dist-windows\release -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw '未找到 Windows 安装包'
          }

          gh release upload $env:TAG $exe.FullName --clobber
          if ($LASTEXITCODE -ne 0) {
            throw '上传 GitHub Release 资产失败'
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: PicHost-Windows-${{ env.TAG }}
          path: dist-windows/release/*.exe
          if-no-files-found: error
          retention-days: 14
